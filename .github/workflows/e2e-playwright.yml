name: Playwright E2E (pytest)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '*' ]

jobs:
  e2e:
    name: Run Playwright E2E (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: Deals99/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and system deps
        working-directory: Deals99/backend
        run: python -m playwright install --with-deps

      - name: Run Django migrations
        working-directory: Deals99/backend
        run: python manage.py migrate --noinput

      - name: Run Playwright E2E tests (pytest)
        working-directory: Deals99/backend
        env:
          # Where tests and conftest will write artifacts
          PYTEST_PLAYWRIGHT_ARTIFACTS: ${{ github.workspace }}/Deals99/backend/playwright-artifacts
        run: |
          # run only the E2E tests we added
          pytest -k e2e_frontend -q
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: Deals99/backend/playwright-artifacts
