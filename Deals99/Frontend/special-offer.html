<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Offers | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(255,152,0,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #ff9800;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #ff9800, #ffb74d);
      border-radius: 2px;
    }
    .offers-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      border-radius: 16px;
      border: 1px solid #ffcc80;
    }
    .offers-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #e65100;
      margin-bottom: 0.5rem;
    }
    .offers-desc {
      color: #666;
      font-size: 1.1rem;
    }
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
    }
    .offer-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(255,152,0,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #fff3e0;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .offer-card:hover {
      box-shadow: 0 8px 32px rgba(255,152,0,0.15);
      transform: translateY(-4px);
    }
    .offer-badge {
      position: absolute;
      top: -10px;
      right: 20px;
      background: linear-gradient(135deg, #ff5722, #ff7043);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .offer-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .offer-name {
      font-weight: 600;
      color: #e65100;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }
    .offer-desc {
      color: #666;
      font-size: 1rem;
      margin-bottom: 1rem;
      min-height: 40px;
    }
    .offer-price {
      color: #4caf50;
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .offer-original {
      color: #999;
      text-decoration: line-through;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .offer-discount {
      background: #ff5722;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .offer-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-offer {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-buy {
      background: #4caf50;
      color: #fff;
    }
    .btn-buy:hover {
      background: #388e3c;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #ff9800;
      color: #fff;
    }
    .btn-view:hover {
      background: #f57c00;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .offers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="site-header" data-active="special-offer"></div>
  <main class="site-main">

  <div class="container">
    <h2><i class="fas fa-gift"></i> Special Offers</h2>
    
    <div class="offers-header">
      <div class="offers-title">🎉 Exclusive Deals Just for You</div>
      <div class="offers-desc">Limited time offers with amazing discounts</div>
    </div>
    
    <div class="offers-grid" id="offersGrid">
      <!-- Special offers will be rendered here -->
    </div>
    </div>

    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script>
    // Demo special offers data
    const offersData = [
      { 
        name: "Monsoon Sale", 
        desc: "Up to 60% Off on Electronics", 
        price: 1999, 
        original: 4999,
        discount: "60% OFF",
        img: "https://cdn-icons-png.flaticon.com/512/1048/1048927.png",
        badge: "Hot Deal"
      },
      { 
        name: "Festive Combo Pack", 
        desc: "3 Gifts @ ₹199", 
        price: 199, 
        original: 599,
        discount: "67% OFF",
        img: "https://cdn-icons-png.flaticon.com/512/3050/3050173.png",
        badge: "Combo"
      },
      { 
        name: "Clearance Stock", 
        desc: "Last Units Left", 
        price: 99, 
        original: 299,
        discount: "67% OFF",
        img: "https://cdn-icons-png.flaticon.com/512/2905/2905673.png",
        badge: "Limited"
      },
      { 
        name: "Student Special", 
        desc: "Back to School Essentials", 
        price: 299, 
        original: 799,
        discount: "63% OFF",
        img: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png",
        badge: "Student"
      },
      { 
        name: "Weekend Flash Sale", 
        desc: "24 Hours Only", 
        price: 149, 
        original: 399,
        discount: "63% OFF",
        img: "https://cdn-icons-png.flaticon.com/512/2921/2921822.png",
        badge: "Flash"
      },
      { 
        name: "Loyalty Rewards", 
        desc: "Special for Regular Customers", 
        price: 399, 
        original: 999,
        discount: "60% OFF",
        img: "https://cdn-icons-png.flaticon.com/512/727/727240.png",
        badge: "Loyalty"
      }
    ];

    function renderOffers() {
      const grid = document.getElementById("offersGrid");
      grid.innerHTML = offersData.map(offer => `
        <div class="offer-card">
          <div class="offer-badge">${offer.badge}</div>
          <img loading="lazy" src="${offer.img}" alt="${offer.name}" class="offer-img">
          <div class="offer-name">${offer.name}</div>
          <div class="offer-desc">${offer.desc}</div>
          <div class="offer-price">₹${offer.price.toLocaleString()}</div>
          <div class="offer-original">₹${offer.original.toLocaleString()}</div>
          <div class="offer-discount">${offer.discount}</div>
          <div class="offer-actions">
            <button class="btn-offer btn-buy add-to-cart" 
                    data-name="${offer.name}" 
                    data-price="${offer.price}" 
                    data-img="${offer.img}" 
                    data-desc="${offer.desc}" 
                    data-category="offers">
              <i class="fas fa-cart-plus"></i> Buy Now
            </button>
            <button class="btn-offer btn-wishlist add-to-wishlist" 
                    data-name="${offer.name}" 
                    data-price="${offer.price}" 
                    data-img="${offer.img}" 
                    data-desc="${offer.desc}" 
                    data-category="offers">
              <i class="fas fa-heart"></i>
            </button>
            <button class="btn-offer btn-view quick-view" 
                    data-name="${offer.name}" 
                    data-price="${offer.price}" 
                    data-img="${offer.img}" 
                    data-desc="${offer.desc}" 
                    data-category="offers">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      `).join("");
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderOffers();
    });
  </script>
</body>
</html>
