<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Arrivals | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body {
      background: linear-gradient(135deg, #e8f5e8 0%, #f1f8e9 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(76,175,80,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #4caf50;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #4caf50, #81c784);
      border-radius: 2px;
    }
    .arrivals-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: linear-gradient(135deg, #e8f5e8 0%, #f1f8e9 100%);
      border-radius: 16px;
      border: 1px solid #c8e6c9;
    }
    .arrivals-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2e7d32;
      margin-bottom: 0.5rem;
    }
    .arrivals-desc {
      color: #666;
      font-size: 1.1rem;
    }
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      padding: 0.5rem 1.2rem;
      border: 2px solid #c8e6c9;
      border-radius: 8px;
      background: #fff;
      color: #4caf50;
      cursor: pointer;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #4caf50;
      color: #fff;
      border-color: #4caf50;
    }
    .arrivals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }
    .arrival-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(76,175,80,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #e8f5e8;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .arrival-card:hover {
      box-shadow: 0 8px 32px rgba(76,175,80,0.15);
      transform: translateY(-4px);
    }
    .arrival-badge {
      position: absolute;
      top: -10px;
      right: 20px;
      background: linear-gradient(135deg, #4caf50, #81c784);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .arrival-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .arrival-name {
      font-weight: 600;
      color: #2e7d32;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .arrival-desc {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      min-height: 40px;
    }
    .arrival-price {
      color: #4caf50;
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .arrival-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-arrival {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-cart {
      background: #4caf50;
      color: #fff;
    }
    .btn-cart:hover {
      background: #388e3c;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #2196f3;
      color: #fff;
    }
    .btn-view:hover {
      background: #1976d2;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .arrivals-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="site-header" data-active="newarrivals"></div>
  <main class="site-main">

  <div class="container">
    <h2><i class="fas fa-star"></i> New Arrivals</h2>
    
    <div class="arrivals-header">
      <div class="arrivals-title">🆕 Fresh Products Just In</div>
      <div class="arrivals-desc">Discover the latest additions to our collection</div>
    </div>
    
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="electronics">Electronics</button>
      <button class="filter-btn" data-filter="fashion">Fashion</button>
      <button class="filter-btn" data-filter="gifts">Gifts</button>
      <button class="filter-btn" data-filter="accessories">Accessories</button>
    </div>
    
    <div class="arrivals-grid" id="arrivalsGrid">
      <!-- New arrivals will be rendered here -->
    </div>
  </div>

    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script>
    // Demo new arrivals data
    const arrivalsData = [
      { 
        name: "Wireless Earbuds", 
        desc: "True wireless earbuds with noise cancellation", 
        price: 2499, 
        category: "electronics",
        img: "https://cdn-icons-png.flaticon.com/512/1048/1048927.png",
        badge: "New"
      },
      { 
        name: "Smart Fitness Band", 
        desc: "Track your health and fitness goals", 
        price: 899, 
        category: "electronics",
        img: "https://cdn-icons-png.flaticon.com/512/3134/3134810.png",
        badge: "Trending"
      },
      { 
        name: "Designer T-Shirt", 
        desc: "Premium cotton t-shirt with unique design", 
        price: 799, 
        category: "fashion",
        img: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png",
        badge: "Hot"
      },
      { 
        name: "Personalized Mug", 
        desc: "Custom photo mug for your loved ones", 
        price: 299, 
        category: "gifts",
        img: "https://cdn-icons-png.flaticon.com/512/3050/3050173.png",
        badge: "Popular"
      },
      { 
        name: "Phone Stand", 
        desc: "Adjustable phone holder for desk", 
        price: 199, 
        category: "accessories",
        img: "https://cdn-icons-png.flaticon.com/512/2921/2921822.png",
        badge: "Best Seller"
      },
      { 
        name: "Bluetooth Speaker", 
        desc: "Portable speaker with deep bass", 
        price: 1499, 
        category: "electronics",
        img: "https://cdn-icons-png.flaticon.com/512/727/727240.png",
        badge: "Limited"
      }
    ];

    function renderArrivals(filter = "all") {
      const grid = document.getElementById("arrivalsGrid");
      let filtered = filter === "all" ? arrivalsData : arrivalsData.filter(p => p.category === filter);
      grid.innerHTML = filtered.map(arrival => `
        <div class="arrival-card">
          <div class="arrival-badge">${arrival.badge}</div>
          <img loading="lazy" src="${arrival.img}" alt="${arrival.name}" class="arrival-img">
          <div class="arrival-name">${arrival.name}</div>
          <div class="arrival-desc">${arrival.desc}</div>
          <div class="arrival-price">₹${arrival.price.toLocaleString()}</div>
          <div class="arrival-actions">
            <button class="btn-arrival btn-cart add-to-cart" 
                    data-name="${arrival.name}" 
                    data-price="${arrival.price}" 
                    data-img="${arrival.img}" 
                    data-desc="${arrival.desc}" 
                    data-category="${arrival.category}">
              <i class="fas fa-cart-plus"></i> Cart
            </button>
            <button class="btn-arrival btn-wishlist add-to-wishlist" 
                    data-name="${arrival.name}" 
                    data-price="${arrival.price}" 
                    data-img="${arrival.img}" 
                    data-desc="${arrival.desc}" 
                    data-category="${arrival.category}">
              <i class="fas fa-heart"></i>
            </button>
            <button class="btn-arrival btn-view quick-view" 
                    data-name="${arrival.name}" 
                    data-price="${arrival.price}" 
                    data-img="${arrival.img}" 
                    data-desc="${arrival.desc}" 
                    data-category="${arrival.category}">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      `).join("");
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderArrivals(this.dataset.filter);
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      renderArrivals();
    });
  </script>
</body>
</html>
