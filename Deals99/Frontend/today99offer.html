<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's ₹99 Deals | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(255,152,0,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #ff9800;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #ff9800, #ffb74d);
      border-radius: 2px;
    }
    .deals-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      border-radius: 16px;
      border: 1px solid #ffcc80;
    }
    .deals-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #e65100;
      margin-bottom: 0.5rem;
    }
    .deals-desc {
      color: #666;
      font-size: 1.1rem;
    }
    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0;
    }
    .timer-item {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      min-width: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .timer-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ff9800;
    }
    .timer-label {
      font-size: 0.8rem;
      color: #666;
    }
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }
    .deal-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(255,152,0,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #fff3e0;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .deal-card:hover {
      box-shadow: 0 8px 32px rgba(255,152,0,0.15);
      transform: translateY(-4px);
    }
    .deal-badge {
      position: absolute;
      top: -10px;
      right: 20px;
      background: linear-gradient(135deg, #ff5722, #ff7043);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .deal-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .deal-name {
      font-weight: 600;
      color: #e65100;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .deal-desc {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      min-height: 40px;
    }
    .deal-price {
      color: #4caf50;
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }
    .deal-original {
      color: #999;
      text-decoration: line-through;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .deal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-deal {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-buy {
      background: #4caf50;
      color: #fff;
    }
    .btn-buy:hover {
      background: #388e3c;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #ff9800;
      color: #fff;
    }
    .btn-view:hover {
      background: #f57c00;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .deals-grid {
        grid-template-columns: 1fr;
      }
      .countdown-timer {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-fire"></i> Today's ₹99 Deals</h2>
    
    <div class="deals-header">
      <div class="deals-title">🔥 Limited Time Offers</div>
      <div class="deals-desc">Amazing deals under ₹99 - Don't miss out!</div>
      <div class="countdown-timer" id="countdownTimer">
        <div class="timer-item">
          <div class="timer-number" id="hours">00</div>
          <div class="timer-label">Hours</div>
        </div>
        <div class="timer-item">
          <div class="timer-number" id="minutes">00</div>
          <div class="timer-label">Minutes</div>
        </div>
        <div class="timer-item">
          <div class="timer-number" id="seconds">00</div>
          <div class="timer-label">Seconds</div>
        </div>
      </div>
    </div>
    
    <div class="deals-grid" id="dealsGrid">
      <!-- Deals will be rendered here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="script.js"></script>
  <script>
    // Demo deals data
    const dealsData = [
      { 
        name: "Phone Stand", 
        desc: "Adjustable phone holder for desk", 
        price: 99, 
        original: 199,
        img: "https://cdn-icons-png.flaticon.com/512/2921/2921822.png",
        badge: "Hot Deal"
      },
      { 
        name: "Earphone Case", 
        desc: "Protective case for earphones", 
        price: 89, 
        original: 149,
        img: "https://cdn-icons-png.flaticon.com/512/1048/1048927.png",
        badge: "Best Seller"
      },
      { 
        name: "Keychain", 
        desc: "Stylish keychain with LED light", 
        price: 79, 
        original: 129,
        img: "https://cdn-icons-png.flaticon.com/512/3700/3700833.png",
        badge: "New"
      },
      { 
        name: "Pen Set", 
        desc: "Pack of 5 colorful pens", 
        price: 69, 
        original: 119,
        img: "https://cdn-icons-png.flaticon.com/512/2905/2905673.png",
        badge: "Popular"
      },
      { 
        name: "Sticker Pack", 
        desc: "50 decorative stickers", 
        price: 59, 
        original: 99,
        img: "https://cdn-icons-png.flaticon.com/512/2905/2905673.png",
        badge: "Limited"
      },
      { 
        name: "Notebook", 
        desc: "Spiral bound notebook 100 pages", 
        price: 49, 
        original: 89,
        img: "https://cdn-icons-png.flaticon.com/512/2905/2905673.png",
        badge: "Trending"
      }
    ];

    function renderDeals() {
      const grid = document.getElementById("dealsGrid");
      grid.innerHTML = dealsData.map(deal => `
        <div class="deal-card">
          <div class="deal-badge">${deal.badge}</div>
          <img loading="lazy" src="${deal.img}" alt="${deal.name}" class="deal-img">
          <div class="deal-name">${deal.name}</div>
          <div class="deal-desc">${deal.desc}</div>
          <div class="deal-price">₹${deal.price}</div>
          <div class="deal-original">₹${deal.original}</div>
          <div class="deal-actions">
            <button class="btn-deal btn-buy add-to-cart" 
                    data-name="${deal.name}" 
                    data-price="${deal.price}" 
                    data-img="${deal.img}" 
                    data-desc="${deal.desc}" 
                    data-category="deals">
              <i class="fas fa-cart-plus"></i> Buy Now
            </button>
            <button class="btn-deal btn-wishlist add-to-wishlist" 
                    data-name="${deal.name}" 
                    data-price="${deal.price}" 
                    data-img="${deal.img}" 
                    data-desc="${deal.desc}" 
                    data-category="deals">
              <i class="fas fa-heart"></i>
            </button>
            <button class="btn-deal btn-view quick-view" 
                    data-name="${deal.name}" 
                    data-price="${deal.price}" 
                    data-img="${deal.img}" 
                    data-desc="${deal.desc}" 
                    data-category="deals">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      `).join("");
    }

    function updateCountdown() {
      const now = new Date();
      const endOfDay = new Date();
      endOfDay.setHours(23, 59, 59, 999);
      
      const diff = endOfDay - now;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderDeals();
      updateCountdown();
      setInterval(updateCountdown, 1000);
    });
  </script>
</body>
</html>
