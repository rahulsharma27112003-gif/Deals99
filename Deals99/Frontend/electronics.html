<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronics | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8f9ff 0%, #e3f2fd 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(33,150,243,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #1976d2;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #1976d2, #64b5f6);
      border-radius: 2px;
    }
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      padding: 0.5rem 1.2rem;
      border: 2px solid #e3f2fd;
      border-radius: 8px;
      background: #fff;
      color: #1976d2;
      cursor: pointer;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #1976d2;
      color: #fff;
      border-color: #1976d2;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(33,150,243,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #e3f2fd;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .product-card:hover {
      box-shadow: 0 8px 32px rgba(33,150,243,0.15);
      transform: translateY(-4px);
    }
    .product-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .product-name {
      font-weight: 600;
      color: #1976d2;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .product-desc {
      color: #666;
      font-size: 0.98rem;
      margin-bottom: 0.5rem;
      min-height: 40px;
    }
    .product-price {
      color: #388e3c;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .product-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-product {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-cart {
      background: #388e3c;
      color: #fff;
    }
    .btn-cart:hover {
      background: #43a047;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #1976d2;
      color: #fff;
    }
    .btn-view:hover {
      background: #1565c0;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-laptop"></i> Electronics</h2>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="audio">Audio</button>
      <button class="filter-btn" data-filter="laptop">Laptops</button>
      <button class="filter-btn" data-filter="mobile">Mobiles</button>
      <button class="filter-btn" data-filter="accessories">Accessories</button>
      <button class="filter-btn" data-filter="smart">Smart Devices</button>
    </div>
    <div class="products-grid" id="productsGrid">
      <!-- Products will be rendered here -->
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="script.js"></script>
  <script>
    // Demo electronics data
    const electronicsProducts = [
      { name: "Wireless Headphones", desc: "Immersive sound, wireless freedom.", price: 1299, img: "https://cdn-icons-png.flaticon.com/512/1048/1048927.png", type: "audio" },
      { name: "Smart Laptop", desc: "Fast, sleek, powerful.", price: 49999, img: "https://cdn-icons-png.flaticon.com/512/679/679720.png", type: "laptop" },
      { name: "Bluetooth Speaker", desc: "Portable, deep bass.", price: 899, img: "https://cdn-icons-png.flaticon.com/512/727/727240.png", type: "audio" },
      { name: "Fitness Smartwatch", desc: "Track health & style.", price: 2499, img: "https://cdn-icons-png.flaticon.com/512/3134/3134810.png", type: "smart" },
      { name: "Mobile Accessories", desc: "Cables, cases, chargers.", price: 199, img: "https://cdn-icons-png.flaticon.com/512/2921/2921822.png", type: "accessories" },
      { name: "Android Smartphone", desc: "Latest Android phone.", price: 15999, img: "https://cdn-icons-png.flaticon.com/512/833/833472.png", type: "mobile" },
      { name: "iOS Smartphone", desc: "Premium iOS device.", price: 69999, img: "https://cdn-icons-png.flaticon.com/512/833/833472.png", type: "mobile" },
      { name: "Smart Home Hub", desc: "Voice assistant, smart home.", price: 3499, img: "https://cdn-icons-png.flaticon.com/512/1048/1048927.png", type: "smart" }
    ];
    function renderProducts(filter = "all") {
      const grid = document.getElementById("productsGrid");
      let filtered = filter === "all" ? electronicsProducts : electronicsProducts.filter(p => p.type === filter);
      grid.innerHTML = filtered.map(prod => `
        <div class="product-card">
          <img src="${prod.img}" alt="${prod.name}" class="product-img">
          <div class="product-name">${prod.name}</div>
          <div class="product-desc">${prod.desc}</div>
          <div class="product-price">₹${prod.price.toLocaleString()}</div>
          <div class="product-actions">
            <button class="btn-product btn-cart add-to-cart" 
                    data-name="${prod.name}" 
                    data-price="${prod.price}" 
                    data-img="${prod.img}" 
                    data-desc="${prod.desc}" 
                    data-category="electronics">
              <i class="fas fa-cart-plus"></i> Cart
            </button>
            <button class="btn-product btn-wishlist add-to-wishlist" 
                    data-name="${prod.name}" 
                    data-price="${prod.price}" 
                    data-img="${prod.img}" 
                    data-desc="${prod.desc}" 
                    data-category="electronics">
              <i class="fas fa-heart"></i>
            </button>
            <button class="btn-product btn-view quick-view" 
                    data-name="${prod.name}" 
                    data-price="${prod.price}" 
                    data-img="${prod.img}" 
                    data-desc="${prod.desc}" 
                    data-category="electronics">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      `).join("");
    }
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderProducts(this.dataset.filter);
      });
    });
    
    document.addEventListener('DOMContentLoaded', function() {
      renderProducts();
    });
  </script>
</body>
</html>
