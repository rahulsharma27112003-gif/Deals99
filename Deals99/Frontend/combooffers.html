<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combo Offers | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(33,150,243,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #2196f3;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #2196f3, #64b5f6);
      border-radius: 2px;
    }
    .combo-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      border-radius: 16px;
      border: 1px solid #90caf9;
    }
    .combo-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1565c0;
      margin-bottom: 0.5rem;
    }
    .combo-desc {
      color: #666;
      font-size: 1.1rem;
    }
    .combo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
    }
    .combo-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(33,150,243,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #e3f2fd;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .combo-card:hover {
      box-shadow: 0 8px 32px rgba(33,150,243,0.15);
      transform: translateY(-4px);
    }
    .combo-badge {
      position: absolute;
      top: -10px;
      right: 20px;
      background: linear-gradient(135deg, #2196f3, #64b5f6);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .combo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .combo-name {
      font-weight: 600;
      color: #1565c0;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }
    .combo-desc {
      color: #666;
      font-size: 1rem;
      margin-bottom: 1rem;
      min-height: 40px;
    }
    .combo-price {
      color: #4caf50;
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .combo-original {
      color: #999;
      text-decoration: line-through;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .combo-save {
      background: #ff5722;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .combo-items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .combo-item {
      background: #e3f2fd;
      color: #1565c0;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .combo-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-combo {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-buy {
      background: #4caf50;
      color: #fff;
    }
    .btn-buy:hover {
      background: #388e3c;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #2196f3;
      color: #fff;
    }
    .btn-view:hover {
      background: #1976d2;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .combo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="site-header" data-active="combooffers"></div>
  <main class="site-main">

  <div class="container">
    <h2><i class="fas fa-box"></i> Combo Offers</h2>
    
    <div class="combo-header">
      <div class="combo-title">💥 Amazing Combo Deals</div>
      <div class="combo-desc">Save more when you buy together</div>
    </div>
    
    <div class="combo-grid" id="comboGrid">
      <!-- Combo offers will be rendered here -->
    </div>
  </div>

    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script>
    // Demo combo offers data
    const comboData = [
      { 
        name: "Fashion Combo Pack", 
        desc: "Complete fashion essentials", 
        price: 499, 
        original: 799,
        save: 300,
        items: ["2 T-Shirts", "1 Cap", "1 Wallet"],
        img: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png",
        badge: "Best Seller"
      },
      { 
        name: "Gadget Essentials Combo", 
        desc: "All your tech needs", 
        price: 899, 
        original: 1399,
        save: 500,
        items: ["Bluetooth Speaker", "Earphones", "Power Bank"],
        img: "https://cdn-icons-png.flaticon.com/512/1048/1048927.png",
        badge: "Limited Time"
      },
      { 
        name: "Gift Combo", 
        desc: "Perfect for any occasion", 
        price: 249, 
        original: 399,
        save: 150,
        items: ["Photo Mug", "Keychain", "Greeting Card"],
        img: "https://cdn-icons-png.flaticon.com/512/3050/3050173.png",
        badge: "Popular"
      },
      { 
        name: "Home Office Combo", 
        desc: "Work from home essentials", 
        price: 399, 
        original: 699,
        save: 300,
        items: ["Desk Lamp", "Pen Set", "Notebook"],
        img: "https://cdn-icons-png.flaticon.com/512/2905/2905673.png",
        badge: "New"
      },
      { 
        name: "Beauty & Care Combo", 
        desc: "Self-care essentials", 
        price: 299, 
        original: 549,
        save: 250,
        items: ["Face Cream", "Lip Balm", "Hand Sanitizer"],
        img: "https://cdn-icons-png.flaticon.com/512/3134/3134810.png",
        badge: "Trending"
      },
      { 
        name: "Kids Fun Combo", 
        desc: "Entertainment for children", 
        price: 199, 
        original: 349,
        save: 150,
        items: ["Coloring Book", "Crayons", "Stickers"],
        img: "https://cdn-icons-png.flaticon.com/512/2921/2921822.png",
        badge: "Kid's Choice"
      }
    ];

    function renderCombos() {
      const grid = document.getElementById("comboGrid");
      grid.innerHTML = comboData.map(combo => `
        <div class="combo-card">
          <div class="combo-badge">${combo.badge}</div>
          <img src="${combo.img}" alt="${combo.name}" class="combo-img">
          <div class="combo-name">${combo.name}</div>
          <div class="combo-desc">${combo.desc}</div>
          <div class="combo-price">₹${combo.price.toLocaleString()}</div>
          <div class="combo-original">₹${combo.original.toLocaleString()}</div>
          <div class="combo-save">Save ₹${combo.save.toLocaleString()}</div>
          <div class="combo-items">
            ${combo.items.map(item => `<span class="combo-item">${item}</span>`).join('')}
          </div>
          <div class="combo-actions">
            <button class="btn-combo btn-buy add-to-cart" 
                    data-name="${combo.name}" 
                    data-price="${combo.price}" 
                    data-img="${combo.img}" 
                    data-desc="${combo.desc}" 
                    data-category="combo">
              <i class="fas fa-cart-plus"></i> Buy Combo
            </button>
            <button class="btn-combo btn-wishlist add-to-wishlist" 
                    data-name="${combo.name}" 
                    data-price="${combo.price}" 
                    data-img="${combo.img}" 
                    data-desc="${combo.desc}" 
                    data-category="combo">
              <i class="fas fa-heart"></i>
            </button>
            <button class="btn-combo btn-view quick-view" 
                    data-name="${combo.name}" 
                    data-price="${combo.price}" 
                    data-img="${combo.img}" 
                    data-desc="${combo.desc}" 
                    data-category="combo">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      `).join("");
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderCombos();
    });
  </script>
</body>
</html>
