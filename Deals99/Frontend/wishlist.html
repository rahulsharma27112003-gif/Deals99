<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - Deals99</title>
  <meta name="description" content="View and manage your wishlist items. Save products for later purchase.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="site-header" data-active="wishlist"></div>
  <main class="site-main">

<!-- Page Header -->
  <section class="page-header bg-danger text-white">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="display-5 fw-bold mb-2">
            <i class="fas fa-heart me-3"></i>My Wishlist
          </h1>
          <p class="lead mb-0">Save your favorite products for later</p>
        </div>
        <div class="col-md-4 text-md-end">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-md-end mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
              <li class="breadcrumb-item active text-white" aria-current="page">Wishlist</li>
            </ol>
          </nav>
        </div>
      </div>
    </div>
  </section>

  <!-- Wishlist Section -->
  <section class="section">
    <div class="container">
      <div class="row">
        <!-- Wishlist Items -->
        <div class="col-lg-9">
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <div class="d-flex justify-content-between align-items-center">
                <h3 class="h5 mb-0">
                  <i class="fas fa-heart me-2"></i>Wishlist Items
                </h3>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-primary btn-sm" onclick="selectAllItems()">
                    <i class="fas fa-check-square me-1"></i>Select All
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="wishlistManager.clearWishlist()">
                    <i class="fas fa-trash me-1"></i>Clear All
                  </button>
                </div>
              </div>
            </div>
            <div class="card-body p-0">
              <div id="wishlistItems">
                <!-- Wishlist items will be loaded here -->
              </div>
            </div>
          </div>
        </div>

        <!-- Wishlist Summary -->
        <div class="col-lg-3">
          <div class="card shadow-sm sticky-top" style="top: 2rem;">
            <div class="card-header bg-white">
              <h3 class="h5 mb-0">
                <i class="fas fa-info-circle me-2"></i>Wishlist Summary
              </h3>
            </div>
            <div class="card-body">
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Total Items:</span>
                <span id="totalItems">0</span>
              </div>
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Selected:</span>
                <span id="selectedItems">0</span>
              </div>
              <div class="summary-item d-flex justify-content-between mb-3">
                <span>Estimated Total:</span>
                <span id="estimatedTotal">₹0</span>
              </div>
              
              <div class="d-grid gap-2">
                <button class="btn btn-primary" id="addSelectedToCart" disabled>
                  <i class="fas fa-cart-plus me-2"></i>Add Selected to Cart
                </button>
                <a href="index.html" class="btn btn-outline-primary">
                  <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                </a>
              </div>

              <!-- Quick Actions -->
              <div class="mt-4">
                <h6 class="mb-3">Quick Actions</h6>
                <div class="d-grid gap-2">
                  <button class="btn btn-outline-success btn-sm" onclick="addAllToCart()">
                    <i class="fas fa-cart-plus me-1"></i>Add All to Cart
                  </button>
                  <button class="btn btn-outline-info btn-sm" onclick="shareWishlist()">
                    <i class="fas fa-share me-1"></i>Share Wishlist
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Recommended Products -->
  <section class="section bg-light">
    <div class="container">
      <h2 class="section-title">You might also like</h2>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="recommendedProducts">
        <!-- Recommended products will be loaded here -->
      </div>
    </div>
  </section>
<!-- Notification Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">
    <!-- Toasts will be added here dynamically -->
  </div>

  <!-- Scripts -->
    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script type="module" src="pages/wishlist-page.js"></script>
</body>
</html>
