<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gifts & Keychains | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
      background: linear-gradient(135deg, #fffbe6 0%, #ffe6ec 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(233,30,99,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #e91e63;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #e91e63, #ffd166);
      border-radius: 2px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(233,30,99,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #ffe6ec;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .product-card:hover {
      box-shadow: 0 8px 32px rgba(233,30,99,0.15);
      transform: translateY(-4px);
    }
    .product-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .product-name {
      font-weight: 600;
      color: #e91e63;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .product-desc {
      color: #666;
      font-size: 0.98rem;
      margin-bottom: 0.5rem;
      min-height: 40px;
    }
    .product-price {
      color: #388e3c;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .product-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-product {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-cart {
      background: #388e3c;
      color: #fff;
    }
    .btn-cart:hover {
      background: #43a047;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #ffd166;
      color: #e91e63;
    }
    .btn-view:hover {
      background: #e91e63;
      color: #fff;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="site-header" data-active="gifts"></div>
  <main class="site-main">

  <div class="container">
    <h2><i class="fas fa-gift"></i> Gifts & Keychains</h2>
    <div class="products-grid" id="giftsGrid">
      <!-- Products will be rendered here -->
    </div>
  </div>
    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script>
    // Demo gifts data
    const giftsProducts = [
      { name: "Custom Keychain", desc: "Personalized photo keychains.", price: 99, img: "https://cdn-icons-png.flaticon.com/512/3700/3700833.png" },
      { name: "Custom Mug", desc: "Custom mugs with your photo or message.", price: 199, img: "https://cdn-icons-png.flaticon.com/512/3050/3050173.png" },
      { name: "Custom Tshirt", desc: "Design your own t-shirt.", price: 599, img: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png" },
      { name: "Photo Frame", desc: "Engraved photo frames.", price: 299, img: "https://cdn-icons-png.flaticon.com/512/1709/1709182.png" },
      { name: "Name Necklace", desc: "Custom name necklaces.", price: 399, img: "https://cdn-icons-png.flaticon.com/512/4785/4785230.png" }
    ];
    function renderGifts() {
      const grid = document.getElementById("giftsGrid");
      grid.innerHTML = giftsProducts.map(prod => `
        <div class="product-card">
          <img src="${prod.img}" alt="${prod.name}" class="product-img">
          <div class="product-name">${prod.name}</div>
          <div class="product-desc">${prod.desc}</div>
          <div class="product-price">₹${prod.price.toLocaleString()}</div>
          <div class="product-actions">
            <button class="btn-product btn-cart add-to-cart" 
                    data-name="${prod.name}" 
                    data-price="${prod.price}" 
                    data-img="${prod.img}" 
                    data-desc="${prod.desc}" 
                    data-category="gifts">
              <i class="fas fa-cart-plus"></i> Cart
            </button>
            <button class="btn-product btn-wishlist add-to-wishlist" 
                    data-name="${prod.name}" 
                    data-price="${prod.price}" 
                    data-img="${prod.img}" 
                    data-desc="${prod.desc}" 
                    data-category="gifts">
              <i class="fas fa-heart"></i>
            </button>
            <button class="btn-product btn-view quick-view" 
                    data-name="${prod.name}" 
                    data-price="${prod.price}" 
                    data-img="${prod.img}" 
                    data-desc="${prod.desc}" 
                    data-category="gifts">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
      `).join("");
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      renderGifts();
    });
  </script>
</body>
</html>
