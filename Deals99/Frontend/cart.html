<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Deals99</title>
  <meta name="description" content="View and manage your shopping cart items. Secure checkout with multiple payment options.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="site-header" data-active="cart"></div>
  <main class="site-main">

<!-- Page Header -->
  <section class="page-header bg-primary text-white">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="display-5 fw-bold mb-2">
            <i class="fas fa-shopping-cart me-3"></i>Shopping Cart
          </h1>
          <p class="lead mb-0">Review your items and proceed to checkout</p>
        </div>
        <div class="col-md-4 text-md-end">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb justify-content-md-end mb-0">
              <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
              <li class="breadcrumb-item active text-white" aria-current="page">Cart</li>
            </ol>
          </nav>
        </div>
      </div>
    </div>
  </section>

  <!-- Cart Section -->
  <section class="section">
    <div class="container">
      <div class="row">
        <!-- Cart Items -->
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <div class="d-flex justify-content-between align-items-center">
                <h3 class="h5 mb-0">
                  <i class="fas fa-shopping-bag me-2"></i>Cart Items
                </h3>
                <button class="btn btn-outline-danger btn-sm" onclick="cartManager.clearCart()">
                  <i class="fas fa-trash me-1"></i>Clear Cart
                </button>
              </div>
            </div>
            <div class="card-body p-0">
              <div id="cartItems">
                <!-- Cart items will be loaded here -->
              </div>
            </div>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4 d-flex">
          <div class="card shadow-sm cart-summary-card" style="top: 2rem;">
            <div class="card-header bg-white">
              <h3 class="h5 mb-0">
                <i class="fas fa-calculator me-2"></i>Order Summary
              </h3>
            </div>
            <div class="card-body">
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Subtotal:</span>
                <span id="subtotal">₹0</span>
              </div>
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Shipping:</span>
                <span id="shipping">₹0</span>
              </div>
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Tax:</span>
                <span id="tax">₹0</span>
              </div>
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Discount:</span>
                <span id="discount">₹0</span>
              </div>
              <hr>
              <div class="summary-item d-flex justify-content-between mb-3">
                <strong>Total:</strong>
                <strong id="total">₹0</strong>
              </div>
              
              <div class="d-grid gap-2">
                <a href="checkout.html" class="btn btn-primary btn-lg" id="checkoutBtn">
                  <i class="fas fa-credit-card me-2"></i>Proceed to Checkout
                </a>
                <a href="index.html" class="btn btn-outline-primary">
                  <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                </a>
              </div>

              <!-- Coupon Code -->
              <div class="mt-4">
                <h6 class="mb-3">Have a coupon?</h6>
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Enter coupon code" id="couponCode">
                  <button class="btn btn-outline-secondary" type="button" onclick="applyCoupon()">
                    Apply
                  </button>
                </div>
                <div id="couponMessage" class="mt-2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Recommended Products -->
  <section class="section bg-light">
    <div class="container">
      <h2 class="section-title">You might also like</h2>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="recommendedProducts">
        <!-- Recommended products will be loaded here -->
      </div>
    </div>
  </section>
<!-- Notification Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">
    <!-- Toasts will be added here dynamically -->
  </div>

  <!-- Scripts -->
    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script type="module" src="pages/cart-page.js"></script>
</body>
</html>
