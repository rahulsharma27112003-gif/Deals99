<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Deals99</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="global.css">
    <style>
    body {
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      font-family: 'Inter', Arial, sans-serif;
      color: #23272f;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(156,39,176,0.10), 0 0 0 1px rgba(255,255,255,0.1);
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h2 {
      font-weight: 700;
      color: #9c27b0;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 2.2rem;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #9c27b0, #ba68c8);
      border-radius: 2px;
    }
    .products-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      border-radius: 16px;
      border: 1px solid #ce93d8;
    }
    .products-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #7b1fa2;
      margin-bottom: 0.5rem;
    }
    .products-desc {
      color: #666;
      font-size: 1.1rem;
    }
    .filters-section {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .filter-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .filter-label {
      font-weight: 600;
      color: #7b1fa2;
      font-size: 0.9rem;
    }
    .filter-select {
      padding: 0.5rem;
      border: 2px solid #e1bee7;
      border-radius: 6px;
      background: #fff;
      color: #7b1fa2;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .filter-select:focus {
      outline: none;
      border-color: #9c27b0;
    }
    .search-box {
      padding: 0.5rem 1rem;
      border: 2px solid #e1bee7;
      border-radius: 6px;
      background: #fff;
      color: #7b1fa2;
      font-size: 0.9rem;
      min-width: 200px;
    }
    .search-box:focus {
      outline: none;
      border-color: #9c27b0;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(156,39,176,0.08);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      text-align: center;
      border: 1px solid #f3e5f5;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .product-card:hover {
      box-shadow: 0 8px 32px rgba(156,39,176,0.15);
      transform: translateY(-4px);
    }
    .product-badge {
      position: absolute;
      top: -10px;
      right: 20px;
      background: linear-gradient(135deg, #9c27b0, #ba68c8);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .product-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 1rem;
      background: #f7f7fa;
      box-shadow: 0 2px 12px #0001;
    }
    .product-name {
      font-weight: 600;
      color: #7b1fa2;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .product-desc {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      min-height: 40px;
    }
    .product-price {
      color: #4caf50;
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }
    .product-original {
      color: #999;
      text-decoration: line-through;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .product-category {
      background: #f3e5f5;
      color: #7b1fa2;
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .product-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .btn-product {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-cart {
      background: #4caf50;
      color: #fff;
    }
    .btn-cart:hover {
      background: #388e3c;
    }
    .btn-wishlist {
      background: #e91e63;
      color: #fff;
    }
    .btn-wishlist:hover {
      background: #ad1457;
    }
    .btn-view {
      background: #9c27b0;
      color: #fff;
    }
    .btn-view:hover {
      background: #7b1fa2;
    }
    .no-products {
      text-align: center;
      color: #666;
      font-size: 1.1rem;
      padding: 2rem;
    }
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
        padding: 1.5rem 0.5rem;
        max-width: 98vw;
      }
      .products-grid {
        grid-template-columns: 1fr;
      }
      .filters-section {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-group {
        justify-content: center;
      }
        }
    </style>
</head>
<body>
  <div id="site-header" data-active="products"></div>
  <main class="site-main">

  <div class="container">
    <h2><i class="fas fa-shopping-bag"></i> All Products</h2>
    
    <div class="products-header">
      <div class="products-title">🛍️ Browse Our Collection</div>
      <div class="products-desc">Find the perfect products for you</div>
    </div>
    
    <p id="productsStatus" class="text-center text-muted small mb-3"></p>
    <div class="filters-section">
      <div class="filter-group">
        <label class="filter-label">Category:</label>
        <select class="filter-select" id="categoryFilter">
          <option value="">All Categories</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Sort by:</label>
        <select class="filter-select" id="sortFilter">
          <option value="name">Name</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="newest">Newest</option>
        </select>
        </div>
      <div class="filter-group">
        <input type="text" class="search-box" id="searchBox" placeholder="Search products...">
        </div>
    </div>

    <div class="products-grid" id="productsGrid">
      <!-- Products will be rendered here -->
    </div>
  </div>

    </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="script.js"></script>
  <script type="module" src="pages/products-page.js"></script>
</body>
</html>
