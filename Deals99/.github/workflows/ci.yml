name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: deals99
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: deals99_backend.config.settings.dev
      SECRET_KEY: ci-secret-key
      DEBUG: 'True'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: deals99
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RAZORPAY_WEBHOOK_SECRET: rpsec_ci
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run black (check)
        run: |
          python -m black --check . || true

      - name: Run flake8
        run: |
          python -m flake8 || true

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U postgres && break || sleep 1; done
        env:
          PGPASSWORD: postgres

      - name: Check migrations are up-to-date
        working-directory: backend
        run: |
          # Fail the job if model changes are not reflected in migrations
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: backend
        run: |
          python manage.py migrate --noinput

      - name: Run tests (pytest)
        working-directory: backend
        run: |
          python -m pytest -q

      - name: Build Docker image (verify Dockerfile)
        if: always()
        working-directory: backend
        run: |
          docker build -t deals99:ci .

      - name: Upload test results (pytest xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/htmlcov || backend/.pytest_cache || ''

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Run bandit security scan
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r backend -ll -iii || true
